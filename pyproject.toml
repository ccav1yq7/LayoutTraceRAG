[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopguide"
version = "0.2.0"
description = "ShopGuide — 面向已购商品的图文使用指导与售后问答 Agent（LangGraph + 证据可追溯 RAG）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gao Yuqi" }]
keywords = ["rag", "agent", "langgraph", "retrieval", "customer-support", "multimodal"]

dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# ShopGuide 主依赖
shopguide = ["sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pillow>=10", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "lancedb>=0.37.1", "langgraph-checkpoint-sqlite>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
shopguide-dev = ["hypothesis>=6", "ruff>=0.9", "mypy>=1.14", "scikit-learn>=1.5"]
storage = ["lancedb>=0.37.1"]
# 检索/嵌入栈（真实 BGE 向量与重排）
retrieval = [
    "lancedb>=0.15",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "socksio>=1.0.0",
    "torchvision>=0.24",
    "pillow>=10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
shopguide = "shopguide.cli:main"

[project.urls]
Homepage = "https://github.com/ccav1yq7/ShopGuide"
Repository = "https://github.com/ccav1yq7/ShopGuide"
Issues = "https://github.com/ccav1yq7/ShopGuide/issues"

[tool.hatch.build.targets.wheel]
packages = ["shopguide"]

[tool.hatch.build.targets.sdist]
include = [
    "shopguide/", "tests/", "scripts/shopguide/", "configs/shopguide/", "configs/ecom/", "configs/pm209/", "configs/intent/", "prompts/shopguide/", "web/", "deploy/shopguide/", ".dockerignore",
    "README.md", "PLAN.md", "LICENSE", "THIRD_PARTY_NOTICES.md",
    "pyproject.toml", "uv.lock", "Makefile", ".gitignore", ".github/", "docs/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# legacy/ 为已舍弃的旧长视频 RAG 归档；显式排除，避免被 pytest 收集。
norecursedirs = ["legacy", ".venv*", "data", "artifacts", ".shopguide", "external", "web/node_modules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layouttrace"
version = "0.1.0"
description = "Evidence-traceable long-video question answering — an agentic RAG orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gao Yuqi" }]
keywords = ["rag", "langgraph", "agent", "long-video", "retrieval", "multimodal"]

dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Retrieval / embedding stack (LanceDB + BGE-M3)
retrieval = [
    "lancedb>=0.15",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "socksio>=1.0.0",
    "torchvision>=0.24",
    "pillow>=10",
]
# Video ingestion (ASR + keyframes + on-frame OCR)
video = [
    "faster-whisper>=1.1.0",
    "av>=14.0.0",
    "rapidocr>=3.9,<4",
    "pillow>=10.0.0",
    "imageio-ffmpeg>=0.6.0",
]
# LLM providers
llm = [
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
layouttrace = "layouttrace.cli:main"

[project.urls]
Homepage = "https://github.com/ccav1yq7/LayoutTraceRAG"
Repository = "https://github.com/ccav1yq7/LayoutTraceRAG"
Issues = "https://github.com/ccav1yq7/LayoutTraceRAG/issues"

[tool.hatch.build.targets.wheel]
packages = ["layouttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
